<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 90%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>#</th>
            <th>Task</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="listBody"></tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new task...">
    <button onclick="addItem()">Add Task</button>
</div>

<script>
    async function renderList() {
        const res = await fetch('/items');
        const items = await res.json();
        const listBody = document.getElementById('listBody');
        listBody.innerHTML = '';

        items.forEach((item, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td id="text-${item.id}">${escapeHtml(item.text)}</td>
                <td>
                    <button onclick="startEdit(${item.id})">Edit</button>
                    <button onclick="deleteItem(${item.id})">Delete</button>
                </td>
            `;
            listBody.appendChild(row);
        });
    }

    async function addItem() {
        const input = document.getElementById('newItem');
        const text = input.value.trim();
        if (!text) return alert('Enter a task');
        await fetch('/items', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        });
        input.value = '';
        renderList();
    }

    async function deleteItem(id) {
        await fetch(`/items/${id}`, { method: 'DELETE' });
        renderList();
    }

    function startEdit(id) {
        const td = document.getElementById(`text-${id}`);
        const oldText = td.innerText;
        td.innerHTML = `<input class="edit-input" id="edit-${id}" value="${oldText}"> <button onclick="confirmEdit(${id})">Save</button>`;
    }

    async function confirmEdit(id) {
        const input = document.getElementById(`edit-${id}`);
        const text = input.value.trim();
        if (!text) return alert('Text cannot be empty');
        await fetch(`/items/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        });
        renderList();
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.addEventListener('DOMContentLoaded', renderList);
</script>

</body>
</html>
